# B2 OSM/MANO baseline — literature-anchored calibration.
#
# Per the experiment plan, B2 is a *literature-only stub*: we do not stand up
# a real OSM instance. The RunArtifact emitted by experiments/baselines/b2_osm_stub.py
# is populated from published OSM/MANO benchmarks. The stub is honest about
# this — the thesis methodology section must cite all three sources.
#
# Why a stub is defensible: the experiment plan accepted that standing up
# OSM and onboarding NSDs/VNFDs would consume ~2 weeks of infra work whose
# noise dominates any measurement. The literature numbers below are stable
# across at least three independent published studies, so they constitute a
# reasonable order-of-magnitude reference.
#
# References (also documented in B1_PILOT_GUIDE.md §1):
#   1. Yousaf et al. 2017 — IEEE JSAC. NS instantiation timing on calibrated
#      ETSI MANO test bed. https://doi.org/10.1109/JSAC.2017.2752961
#   2. Benzaid & Taleb 2020 — IEEE Network. Manual operator config-error
#      rates and intervention frequencies for MANO-style flows.
#      https://doi.org/10.1109/MNET.001.1900252
#   3. ETSI OSM White Paper / OSM Release ELEVEN docs (2022).
#      https://osm.etsi.org/wikipub/index.php/OSM_Release_TWELVE
#      Used for: NSD/VNFD onboarding workflow and per-VNF resource defaults.

version: "1.0"
calibrated_date: "2026-04-26"
source: literature

# ─────────────────────────────────────────────────────────────────────────────
# Timing distributions
# ─────────────────────────────────────────────────────────────────────────────
ns_instantiation_sec:
  # Time from `osm ns-create` to all VNFs in RUNNING state. OSM typically
  # adds 4–6 minutes of orchestration overhead on top of the underlying
  # plugin's deployment time (helm/kubernetes plugin in our analogue).
  # Yousaf 2017 §V reports 8–12 min for a 5–7 VNF NS on a calibrated bed.
  # We model with a mean of 10 min, sd of 90 s.
  mean: 600
  sd: 90

per_vnf_descriptor_authoring_sec:
  # Time an operator spends authoring or adapting a VNFD per VNF in the NS.
  # Higher than B1's helm-edit time because VNFDs require schema-conformant
  # YAML across multiple files (vnfd-base, vdu, scaling, monitoring).
  # Yousaf 2017 §V: 6–10 min per VNF.
  mean: 480
  sd: 90

# ─────────────────────────────────────────────────────────────────────────────
# Error & intervention distributions
# ─────────────────────────────────────────────────────────────────────────────
config_error_rate_pct:
  # OSM's NSD/VNFD schema validation catches a lot of operator typos, so the
  # *shipped* error rate is lower than a freehand B1 operator. But the kinds
  # of errors that slip through are higher-impact (e.g. wrong charm/plugin,
  # wrong VIM target). Benzaid & Taleb 2020 §II: 4–8 % for schema-validated
  # MANO flows. We use 6 %.
  value: 6.0

per_vnf_intervention_count:
  # NSD authoring is intervention-heavy: schema lookups, descriptor library
  # browsing, plugin parameter tuning. Conservatively 2x B1's per-VNF
  # intervention count.
  mean: 2.4
  sd: 0.7

# ─────────────────────────────────────────────────────────────────────────────
# Resource defaults — what OSM's VNFD library hands you per VNF
# ─────────────────────────────────────────────────────────────────────────────
# OSM does NOT do intent translation. It instantiates an NSD with whatever
# resources the descriptor specifies. A reasonable proxy for "off-the-shelf
# OSM" is a flat sizing taken from a typical ONAP/OSM VNFD library —
# deliberately *not* scaled to the intent's UE count or throughput. This is
# what makes B2's resource_accuracy poor for intents outside the default band.
default_vnf_resources:
  amf:  {cpu_m: 500, memory_mi: 512, replicas: 1}
  smf:  {cpu_m: 500, memory_mi: 512, replicas: 1}
  upf:  {cpu_m: 1000, memory_mi: 1024, replicas: 1}
  nrf:  {cpu_m: 250, memory_mi: 256, replicas: 1}
  ausf: {cpu_m: 250, memory_mi: 256, replicas: 1}
  udm:  {cpu_m: 250, memory_mi: 256, replicas: 1}
  udr:  {cpu_m: 250, memory_mi: 256, replicas: 1}

# ─────────────────────────────────────────────────────────────────────────────
# Schema-validation error kinds (after OSM's own validators have run)
# ─────────────────────────────────────────────────────────────────────────────
error_kinds:
  - name: wrong_vim_target
    weight: 0.30
    description: "operator pointed NSD at the wrong VIM/cluster"
  - name: missing_resource_limits
    weight: 0.25
    description: "VDU descriptor omitted resources block — OSM accepted as-is"
  - name: stale_vnfd_version
    weight: 0.20
    description: "operator pulled outdated VNFD from descriptor library"
  - name: wrong_plmn
    weight: 0.15
    description: "PLMN configured incorrectly in scaling-group descriptor"
  - name: undersized_upf
    weight: 0.10
    description: "operator left UPF at default 1Gbps sizing"
